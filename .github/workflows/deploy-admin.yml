name: Deploy Admin Panel

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SERVER_ROOT: /var/www/foxrun_in_usr/data/www/foxrun.in
  ADMIN_PATH: /var/www/foxrun_in_usr/data/www/foxrun.in/admin

jobs:
  build-and-test:
    name: 🧪 CI - Quality & Build Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, mysql, pdo, dom, curl, grpc, bcmath, intl
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Cache Composer Dependencies
        uses: actions/cache@v3
        with:
          path: admin/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('admin/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: |
          cd admin
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --prefer-dist --no-interaction --no-progress --no-dev --ignore-platform-reqs

      - name: Install NPM Dependencies & Build Vite Assets
        run: |
          cd admin
          npm ci
          npm run build

  deploy:
    name: 🚀 CD - Server Deployment
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate .env file on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || '187.127.148.197' }}
          username: ${{ secrets.SSH_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            echo "📝 Writing .env file to ${{ env.ADMIN_PATH }}/.env..."
            cat > ${{ env.ADMIN_PATH }}/.env << 'ENVEOF'
            APP_NAME=${{ secrets.APP_NAME }}
            APP_ENV=live
            APP_KEY=${{ secrets.APP_KEY }}
            APP_DEBUG=false
            APP_INSTALL=true
            APP_LOG_LEVEL=debug
            APP_MODE=live
            APP_URL=${{ secrets.APP_URL }}

            DB_CONNECTION=mysql
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            BROADCAST_DRIVER=log
            CACHE_DRIVER=file
            SESSION_DRIVER=file
            SESSION_LIFETIME=120
            QUEUE_DRIVER=sync

            REDIS_HOST=127.0.0.1
            REDIS_PASSWORD=null
            REDIS_PORT=6379

            PUSHER_APP_ID=
            PUSHER_APP_KEY=
            PUSHER_APP_SECRET=
            PUSHER_APP_CLUSTER=mt1

            PURCHASE_CODE=

            DIGILOCKER_CLIENT_ID=${{ secrets.DIGILOCKER_CLIENT_ID }}
            DIGILOCKER_CLIENT_SECRET=${{ secrets.DIGILOCKER_CLIENT_SECRET }}
            DIGILOCKER_REDIRECT_URI=${{ secrets.DIGILOCKER_REDIRECT_URI }}
            DIGILOCKER_BASE_URL=https://api.digitallocker.gov.in/public/oauth2/1
            DIGILOCKER_AUTH_URL=https://api.digitallocker.gov.in/public/oauth2/1/authorize
            DIGILOCKER_TOKEN_URL=https://api.digitallocker.gov.in/public/oauth2/1/token
            DIGILOCKER_API_VERSION=2
            ENVEOF

            # Remove leading whitespace from heredoc
            sed -i 's/^[[:space:]]*//' ${{ env.ADMIN_PATH }}/.env
            echo "✅ .env file written successfully"

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || '187.127.148.197' }}
          username: ${{ secrets.SSH_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            echo "🔄 Navigating to repository root..."
            cd ${{ env.SERVER_ROOT }}

            echo "⬇️ Pulling latest changes from repository..."
            git reset --hard HEAD
            git pull origin main

            echo "🔄 Navigating to admin panel folder..."
            cd ${{ env.ADMIN_PATH }}
            mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs

            echo "📦 Enabling Maintenance Mode..."
            php artisan down || true

            echo "⚡ Installing Composer Production Dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs

            echo "🎨 Building Assets..."
            npm ci
            npm run build

            echo "🗄️ Running Database Migrations..."
            php artisan migrate --force

            echo "🧹 Clearing and Rebuilding Caches..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            echo "🔒 Resetting Storage & Bootstrap Cache Permissions..."
            chown -R foxrun_in_usr:foxrun_in_usr storage bootstrap/cache
            chmod -R 777 storage bootstrap/cache

            echo "✅ Disabling Maintenance Mode..."
            php artisan up

            echo "🚀 Deployment Successful!"
